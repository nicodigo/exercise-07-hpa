# TODO: Deployment with 2 replicas, resource requests/limits
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-cicd-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-cicd

  template:
    metadata:
      labels:
        app: node-cicd

    spec:
      containers:

        - name: node-cicd
          image: ghcr.io/nicodigo/exercise-06-cicd:latest
          imagePullPolicy: IfNotPresent
          ports: 
            - containerPort: 8080

          env:
            - name: POSTGRES_USER
              value: noderegistry
            - name: POSTGRES_PASSWORD
              value: noderegistry
            - name: POSTGRES_DB
              value: noderegistry
            - name: DATABASE_URL
              value: postgresql://noderegistry:noderegistry@db:5432/noderegistry

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

